server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text-based assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — all routes serve index.html so Vue Router handles navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints all JS/CSS/asset filenames, so they can be cached forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so the browser always fetches the latest version.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
